<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Boxer throwing a jab -->
  <circle cx="16" cy="10" r="6" fill="white"/>
  <!-- Body -->
  <path d="M16 16 L16 34" stroke="white" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Lead arm extended (jab) -->
  <path d="M16 22 L46 20" stroke="white" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Rear hand at chin (guard) -->
  <path d="M16 22 L8 18" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Legs in boxing stance -->
  <path d="M14 34 L8 52" stroke="white" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M18 34 L26 50" stroke="white" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Boxing glove on lead hand -->
  <ellipse cx="50" cy="19" rx="8" ry="6" fill="white"/>
  <rect x="44" y="14" width="8" height="5" rx="2" fill="white"/>
</svg>
